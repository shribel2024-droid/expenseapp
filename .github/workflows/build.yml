name: Build DailyExpense APK


on:
  workflow_dispatch:


jobs:

  build:

    runs-on: ubuntu-latest


    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Setup Python
      uses: actions/setup-python@v5

      with:
        python-version: "3.11"


    - name: Install Build Tools
      run: |

        pip install --upgrade pip
        pip install buildozer
        pip install cython


    - name: Android Dependencies
      run: |

        sudo apt update

        sudo apt install -y \
        openjdk-17-jdk \
        zip \
        unzip \
        autoconf \
        libtool \
        pkg-config


    - name: Build APK
      run: |

        buildozer android debug


    - name: Upload APK
      uses: actions/upload-artifact@v4

      with:

        name: DailyExpenseAPK

        path: bin/*.apk
